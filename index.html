<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MULTIVERSE Command Surface v1</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050914">
    
    <link rel="stylesheet" href="./css/commander.css">
</head>
<body>
    <header class="app-header">
        <h1>MULTIVERSE COMMAND SURFACE</h1>
        <div class="status-indicators">
            <span id="status-ui" class="sys-badge online">UI: ONLINE</span>
            <span id="status-backend" class="sys-badge offline">Backend: NOT CONNECTED</span>
        </div>
    </header>

    <!-- タブ切り替え（スマホの干渉を受けない上部配置） -->
    <nav class="top-tabbar" aria-label="Main Navigation">
        <button type="button" class="tab-btn active" data-tab="commander" aria-selected="true" aria-controls="view-commander">
            <span class="icon">🏯</span><span class="label">本城</span>
        </button>
        <button type="button" class="tab-btn" data-tab="units" aria-selected="false" aria-controls="view-units">
            <span class="icon">⚔️</span><span class="label">部隊</span>
        </button>
        <button type="button" class="tab-btn" data-tab="tasks" aria-selected="false" aria-controls="view-tasks">
            <span class="icon">📋</span><span class="label">任務・DB</span>
        </button>
        <button type="button" class="tab-btn" data-tab="advisor" aria-selected="false" aria-controls="view-advisor">
            <span class="icon">🧠</span><span class="label">参謀</span>
        </button>
    </nav>

    <!-- VIEW: 本城 -->
    <main id="view-commander" class="view-container active" role="tabpanel">
        <div class="panel">
            <div class="avatar-box">
                <div class="avatar-frame">👑</div>
                <div class="avatar-info">
                    <h2>Emperor</h2>
                    <p>第一司令官</p>
                </div>
            </div>
            <div class="asset-summary">
                総資産: <strong id="ui-total-assets">0</strong> 円
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">📊 戦況観測モニター</div>
            <div id="ui-emperor-eye" class="obs-box">[観測データ待機中]</div>
        </div>

        <div class="panel">
            <div class="panel-header">📟 司令ターミナル</div>
            <div class="chat-box" id="ui-chat-box">
                <div class="msg system">【System】 Command Surface v1 Initialized.</div>
            </div>
            <div class="input-group">
                <input type="text" id="cmd-input" placeholder="コマンドを入力...">
                <button type="button" class="btn" id="btn-send-cmd">送信</button>
            </div>
        </div>
    </main>

    <!-- VIEW: 部隊 -->
    <main id="view-units" class="view-container hidden" role="tabpanel">
        <div class="panel">
            <div class="panel-header">⚔️ 司令・部隊レジストリ</div>
            <div class="data-list" id="units-list"></div>
        </div>
    </main>

    <!-- VIEW: 任務・DB -->
    <main id="view-tasks" class="view-container hidden" role="tabpanel">
        <div class="panel">
            <div class="panel-header">📋 任務一覧</div>
            <div class="input-group">
                <input type="text" id="new-task-input" placeholder="新しい任務...">
                <button type="button" class="btn" id="btn-add-task">追加</button>
            </div>
            <div class="data-list" id="ui-tasks-list"></div>
        </div>
        
        <div class="panel">
            <div class="panel-header">💰 収益記録</div>
            <div class="input-group">
                <input type="number" id="new-rev-input" placeholder="収益額 (例: 5000)">
                <button type="button" class="btn" id="btn-add-rev">記録</button>
            </div>
            <div class="data-list" id="ui-rev-list"></div>
        </div>

        <div class="panel warning-border">
            <div class="panel-header warning-text">⚙️ Runtime State Management</div>
            <div class="input-group">
                <button type="button" class="btn" id="btn-export">Export (書出)</button>
                <button type="button" class="btn btn-danger" id="btn-import-prompt">Import (読込)</button>
            </div>
            <input type="file" id="file-import" accept=".json,application/json" style="display: none;">
        </div>
    </main>

    <!-- VIEW: 参謀 -->
    <main id="view-advisor" class="view-container hidden" role="tabpanel">
        <div class="panel">
            <div class="panel-header">🛡️ 確率計算モデル (客観観測)</div>
            <p class="muted-text">※モデル上の計算結果です。最終的な作戦決定(Owner Decision)は司令官が行います。</p>
            <div class="input-group vertical">
                <input type="number" id="ev-odds" placeholder="オッズ (例: 3.0)" step="0.1">
                <input type="number" id="ev-winrate" placeholder="想定勝率 % (例: 40)">
                <input type="number" id="ev-bank" placeholder="総資金 (例: 100000)">
                <input type="number" id="ev-stake" placeholder="予定掛金 (例: 5000)">
                <button type="button" class="btn btn-primary" id="btn-calc-ev">計算実行</button>
            </div>
            <div id="ev-result" class="result-box hidden"></div>
        </div>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
