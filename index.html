<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MULTIVERSE - 3D Avatar Test</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050914; color: white; font-family: sans-serif; }
        /* 3Dを描画するキャンバスを一番奥に配置 */
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        
        /* 既存のUIはこのキャンバスの手前に透けるように配置する */
        .ui-layer { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(13, 19, 33, 0.8); padding: 20px; border: 1px solid #ffd36a; border-radius: 8px; backdrop-filter: blur(5px); }
        button { background: #ffd36a; color: #000; border: none; padding: 10px 15px; margin: 5px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 3D表示用キャンバス -->
    <canvas id="webgl-canvas"></canvas>

    <!-- 司令システムのUIレイヤー（現在作っているものをここに重ねる） -->
    <div class="ui-layer">
        <h2 style="color: #55dcff; margin-top:0;">MULTIVERSE 3D CORE</h2>
        <p>世界観の切り替えテスト</p>
        <button onclick="changeTheme('cyber')">🌃 サイバーパンク空間へ</button>
        <button onclick="changeTheme('sengoku')">🏯 戦国・本城空間へ</button>
        <button onclick="triggerMotion()">⚔️ アバターに指示を出す</button>
    </div>

    <!-- Three.js と VRMローダーの読み込み -->
    <!-- ※本番ではこれらをGitHubの自分のリポジトリに保存して読み込みます -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';

        let scene, camera, renderer, currentVrm;

        // 1. 3D空間（シーン）の初期設定
        function init() {
            const canvas = document.getElementById('webgl-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.2, -3.0); // アバターの正面にカメラを配置
            camera.lookAt(0, 1.0, 0);

            // 光源の設定
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(1, 1, -1).normalize();
            scene.add(light);
            
            const ambient = new THREE.AmbientLight(0x404040, 1.5);
            scene.add(ambient);

            // 2. アバター（.vrmファイル）の読み込み
            loadAvatar('https://raw.githubusercontent.com/pixiv/three-vrm/dev/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm'); // ※テスト用の公式サンプルモデル

            // ループ処理開始
            animate();
        }

        // アバター読み込み関数
        function loadAvatar(url) {
            const loader = new GLTFLoader();
            loader.register((parser) => { return new VRMLoaderPlugin(parser); });

            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                scene.add(vrm.scene);
                currentVrm = vrm;
                
                // アバターを少し回転させてかっこいい角度に
                vrm.scene.rotation.y = Math.PI; 
            });
        }

        // 3. アニメーションループ（常に画面を更新し続ける）
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();

            // アバターが存在すれば、瞬きなどの自動アニメーションを更新
            if (currentVrm) {
                currentVrm.update(deltaTime);
                // 待機モーション：ゆっくり上下に呼吸するように動かす
                currentVrm.scene.position.y = Math.sin(clock.elapsedTime * 2) * 0.02;
            }
            renderer.render(scene, camera);
        }

        // ==========================================
        // UIからの操作（グローバル関数として登録）
        // ==========================================
        
        // テーマ（世界観）の切り替え
        window.changeTheme = function(theme) {
            if (theme === 'cyber') {
                // サイバーパンク風：背景を暗いネオンブルーにし、青い光を当てる
                scene.background = new THREE.Color(0x050714);
                scene.children[0].color = new THREE.Color(0x55dcff); // ライトの色変更
                console.log("【システム】サイバー空間へ移行しました");
            } else if (theme === 'sengoku') {
                // 戦国風：背景を夕暮れや金屏風のような色にし、黄金の光を当てる
                scene.background = new THREE.Color(0x2a1b0a);
                scene.children[0].color = new THREE.Color(0xffd36a);
                console.log("【システム】戦国本城へ移行しました");
            }
        };

        // アバターにモーション（指示）を出した時のリアクション
        window.triggerMotion = function() {
            if (!currentVrm) return;
            // 例：クリックするとアバターが頷く（首のボーンを回転させる）
            const head = currentVrm.humanoid.getNormalizedBoneNode('head');
            if (head) {
                head.rotation.x = 0.2; // 下を向く
                setTimeout(() => { head.rotation.x = 0; }, 300); // 戻る
            }
        };

        // 画面サイズ変更対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
