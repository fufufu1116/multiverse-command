<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIVERSE LIVE - 成果物アーカイブ</title>
    <style>
        :root { 
            --bg-dark: #0b0f19; 
            --panel-bg: rgba(18, 24, 38, 0.85); 
            --gold: #d4af37; 
            --gold-light: #f3e5ab; 
            --text-main: #e2e8f0; 
            --text-muted: #94a3b8; 
            --border-gold: rgba(212, 175, 55, 0.4); 
        }
        body { 
            margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); 
            font-family: 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; 
        }
        header { 
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; 
            background: rgba(11, 15, 25, 0.95); border-bottom: 2px solid var(--gold); 
        }
        header h1 { margin: 0; font-size: 1.2rem; color: var(--gold); }
        .nav-btn { 
            color: var(--gold-light); text-decoration: none; font-size: 0.75rem; 
            border: 1px solid var(--border-gold); padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,0.3); 
        }
        .container { max-width: 1000px; margin: 15px auto; padding: 0 10px; display: grid; grid-template-columns: 1fr; gap: 15px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-gold); border-radius: 8px; padding: 15px; }
        .panel h3 { margin-top: 0; color: var(--gold-light); border-bottom: 1px solid var(--border-gold); padding-bottom: 6px; font-size: 1rem; }
        .archive-item { background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-gold); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
        .archive-item h4 { margin: 0 0 4px; color: var(--gold); font-size: 0.9rem; }
        .archive-item p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }
        footer { 
            text-align: center; padding: 15px; font-size: 0.75rem; color: var(--text-muted); 
            border-top: 1px solid rgba(255,255,255,0.05); margin-top: 20px; 
        }
    </style>
</head>
<body>
    <header>
        <h1>⚔️ 成果物アーカイブ</h1>
        <a href="index.html" class="nav-btn">◀ 司令室へ</a>
    </header>
    <div class="container">
        <div class="panel">
            <h3>設計図・プロトコル履歴</h3>
            <div style="margin-top: 10px;">
                <div class="archive-item">
                    <h4>フェーズ1：マルチページUI基盤構築</h4>
                    <p>ステータス：完了 / Vercel自動デプロイ連携済み</p>
                </div>
                <div class="archive-item">
                    <h4>軽量プロトコル（ポータブル引き継ぎ）</h4>
                    <p>ステータス：運用中 / AIプロバイダー非依存設計</p>
                </div>
                <div class="archive-item">
                    <h4>Keirin Boundaries (安全境界)</h4>
                    <p>ステータス：凍結維持 (Frozen N2 / 合成比較のみ)</p>
                </div>
            </div>
        </div>
    </div>
    <footer>Owner主権 × AI連携 × 未来創造</footer>
</body>
</html>
