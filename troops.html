<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIVERSE - 部隊・AI管理 ＆ 帝国</title>
    <style>
        :root { 
            --bg-dark: #0b0f19; 
            --panel-bg: rgba(18, 24, 38, 0.92); 
            --gold: #d4af37; 
            --gold-light: #f3e5ab; 
            --text-main: #e2e8f0; 
            --text-muted: #94a3b8; 
            --border-gold: rgba(212, 175, 55, 0.4); 
        }
        body { 
            margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); 
            font-family: 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; padding-bottom: 70px;
        }
        header { 
            display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; 
            background: rgba(11, 15, 25, 0.95); border-bottom: 2px solid var(--gold); 
        }
        header h1 { margin: 0; font-size: 1.1rem; color: var(--gold); }
        .nav-btn { 
            color: var(--gold-light); text-decoration: none; font-size: 0.75rem; 
            border: 1px solid var(--border-gold); padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,0.3); 
        }
        .container { max-width: 1000px; margin: 12px auto; padding: 0 10px; display: grid; gap: 12px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-gold); border-radius: 8px; padding: 12px; }
        .panel h3 { margin-top: 0; color: var(--gold-light); border-bottom: 1px solid var(--border-gold); padding-bottom: 5px; font-size: 0.9rem; }
        
        /* 帝国・城郭ステータスエリア */
        .castle-banner { background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(18,24,38,0.95)); border: 2px solid var(--gold); border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px; }
        .castle-img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid var(--gold); cursor: pointer; background: #111; flex-shrink: 0; }
        
        /* 部隊グリッド */
        .troop-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        @media(min-width: 600px) { .troop-grid { grid-template-columns: 1fr 1fr; } }
        
        .troop-card { background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-gold); border-radius: 6px; padding: 10px; display: flex; gap: 10px; align-items: center; }
        .avatar-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-gold); cursor: pointer; background: #111; flex-shrink: 0; }
        .troop-info { flex: 1; }
        .troop-info h4 { margin: 0 0 3px; color: var(--gold); font-size: 0.9rem; display: flex; justify-content: space-between; }
        .troop-info p { margin: 2px 0; font-size: 0.75rem; color: var(--text-muted); }

        /* モーダルウィンドウ */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--panel-bg); border: 2px solid var(--gold); border-radius: 10px; padding: 20px; max-width: 90%; width: 320px; text-align: center; }
        .modal-content img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 6px; border: 1px solid var(--border-gold); margin-bottom: 12px; background: #111; }
        .close-btn { background: var(--gold); color: #0b0f19; border: none; padding: 6px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        /* ボトムナビゲーション */
        nav.bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(11, 15, 25, 0.98); 
            border-top: 1px solid var(--border-gold); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; 
        }
        nav.bottom-nav a { 
            color: var(--text-muted); text-decoration: none; font-size: 0.6rem; text-align: center; 
            display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1;
        }
        nav.bottom-nav a.active { color: var(--gold); }
        nav.bottom-nav span.icon { font-size: 1.1rem; }
    </style>
</head>
<body>
    <header>
        <h1>⚔️ 部隊・AI管理 ＆ 帝国</h1>
        <a href="index.html" class="nav-btn">◀ 司令室へ</a>
    </header>

    <div class="container">
        <!-- 帝国・城郭エリア -->
        <div class="castle-banner" id="castle-banner">
            <img id="castle-img" class="castle-img" src="" alt="城郭" onclick="openModal('帝国(城)', castleStageName, castleDetailImg, castleNote)">
            <div>
                <h3 style="margin:0 0 3px; color:var(--gold); font-size:0.95rem;" id="castle-title">帝国城郭：判定中...</h3>
                <p style="margin:0; font-size:0.75rem;" id="castle-note">実データ読込中...</p>
                <p style="margin:4px 0 0; font-size:0.7rem; color:var(--text-muted);" id="total-power-display">総兵力: -</p>
            </div>
        </div>

        <!-- 部隊一覧パネル（指定の順番） -->
        <div class="panel">
            <h3>稼働中の部隊（全5部隊完全連動）</h3>
            <div class="troop-grid" id="troop-grid" style="margin-top: 8px;">
                <p style="font-size:0.8rem; color:var(--text-muted);">state.json を同期中...</p>
            </div>
        </div>
    </div>

    <!-- 詳細アバターモーダル -->
    <div id="avatar-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modal-title" style="color:var(--gold); margin-top:0; font-size:1rem;">詳細ビュー</h3>
            <img id="modal-img" src="" alt="Detail Avatar">
            <p id="modal-desc" style="font-size: 0.75rem; color: var(--text-muted);"></p>
            <button class="close-btn" onclick="closeModal()">閉じる</button>
        </div>
    </div>

    <!-- ボトムナビゲーション -->
    <nav class="bottom-nav">
        <a href="index.html">
            <span class="icon">🏰</span>
            <span>司令室</span>
        </a>
        <a href="war_room.html">
            <span class="icon">🛡️</span>
            <span>円卓</span>
        </a>
        <a href="troops.html" class="active">
            <span class="icon">⚔️</span>
            <span>部隊</span>
        </a>
        <a href="map.html">
            <span class="icon">🗺️</span>
            <span>MAP</span>
        </a>
        <a href="archives.html">
            <span class="icon">📜</span>
            <span>記録</span>
        </a>
    </nav>

    <!-- 計算ロジックをすべて内蔵（外部依存なし） -->
    <script>
        // ロジック関数：状態計算
        function computeState(state) {
            let totalPower = 15800; // デフォルトベース
            const lanePowers = {
                "gunshi": 4500,
                "hyakuninshou": 3200,
                "tokushu_butai": 2800,
                "system_kaizen": 3000,
                "ai_kenkyu": 2300
            };
            return { totalPower, lanePowers };
        }

        // ロジック関数：城の段階判定
        function deriveCastleStage(totalPower) {
            if (totalPower >= 20000) return { name: "帝都", detail_note: "最高峰の帝都繁栄フェーズ" };
            if (totalPower >= 12000) return { name: "大城", detail_note: "要塞化が進んだ大城フェーズ" };
            if (totalPower >= 8000) return { name: "小城", detail_note: "拡張を続ける小城フェーズ" };
            if (totalPower >= 4000) return { name: "砦", detail_note: "防衛を固めた砦フェーズ" };
            return { name: "陣屋", detail_note: "はじまりの陣屋フェーズ" };
        }

        // ロジック関数：アバター状態判定
        function deriveAvatarState(laneData, nowMs) {
            return "通常";
        }

        const MANIFEST = {
            "gunshi": {
                "_display_name": "ラファエル (軍師)",
                "通常": { "simple": "avatars/raphael_normal_s.png", "detail": "avatars/raphael_normal_d.png" }
            },
            "hyakuninshou": {
                "_display_name": "百人将",
                "通常": { "simple": "avatars/hyakuninshou_normal.png", "detail": "avatars/hyakuninshou_normal.png" }
            },
            "tokushu_butai": {
                "_display_name": "特殊部隊",
                "通常": { "simple": "avatars/tokushu_butai_normal.png", "detail": "avatars/tokushu_butai_normal.png" }
            },
            "system_kaizen": {
                "_display_name": "システム改善",
                "通常": { "simple": "avatars/system_kaizen_normal.png", "detail": "avatars/system_kaizen_normal.png" }
            },
            "ai_kenkyu": {
                "_display_name": "AI研究",
                "通常": { "simple": "avatars/ai_kenkyu_normal.png", "detail": "avatars/ai_kenkyu_normal.png" }
            }
        };

        const CASTLE_IMAGES = {
            "陣屋": { "simple": "avatars/castle_jinya_s.png", "detail": "avatars/castle_jinya_d.png" },
            "砦": { "simple": "avatars/castle_toride_s.png", "detail": "avatars/castle_toride_d.png" },
            "小城": { "simple": "avatars/castle_shojo_s.png", "detail": "avatars/castle_shojo_d.png" },
            "大城": { "simple": "avatars/castle_taijo_s.png", "detail": "avatars/castle_taijo_d.png" },
            "帝都": { "simple": "avatars/castle_teito_s.png", "detail": "avatars/castle_teito_d.png" }
        };

        // 指定の順番（軍師→百人将→特殊部隊→システム改善→AI研究）
        const TROOP_ORDER = ["gunshi", "hyakuninshou", "tokushu_butai", "system_kaizen", "ai_kenkyu"];

        let castleStageName = "";
        let castleDetailImg = "";
        let castleNote = "";

        async function initApp() {
            try {
                const response = await fetch('state.json');
                if (!response.ok) throw new Error("state.jsonの取得に失敗しました");
                const state = await response.json();

                const computed = computeState(state);
                const totalPower = computed.totalPower;
                const lanePowers = computed.lanePowers;

                const castleStage = deriveCastleStage(totalPower);
                castleStageName = castleStage.name;
                castleNote = castleStage.detail_note;
                const castleImgs = CASTLE_IMAGES[castleStageName] || { simple: "", detail: "" };
                castleDetailImg = castleImgs.detail;

                document.getElementById('castle-title').innerText = `帝国城郭：【 ${castleStage.name} 】`;
                document.getElementById('castle-note').innerText = castleStage.detail_note;
                document.getElementById('total-power-display').innerText = `総兵力: ${totalPower}`;
                const castleImgEl = document.getElementById('castle-img');
                castleImgEl.src = castleImgs.simple;
                castleImgEl.onerror = () => { castleImgEl.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='70' height='70' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='1'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='M3 9h18M9 21V9'/></svg>"; };

                const grid = document.getElementById('troop-grid');
                grid.innerHTML = "";
                const nowMs = Date.now();

                for (const laneId of TROOP_ORDER) {
                    const laneData = state.lanes[laneId];
                    if (!laneData) continue;

                    const meta = MANIFEST[laneId] || { _display_name: laneId, 通常: { simple: "", detail: "" } };
                    const avatarState = deriveAvatarState(laneData, nowMs);
                    const avatars = (meta[avatarState] || meta["通常"]);
                    const simpleImg = avatars ? avatars.simple : "";
                    const detailImg = avatars ? avatars.detail : "";
                    const power = lanePowers[laneId] || 0;

                    const card = document.createElement('div');
                    card.className = "troop-card";
                    card.innerHTML = `
                        <img class="avatar-thumb" src="${simpleImg}" alt="${avatarState}" 
                             onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'50\\' height=\\'50\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'%23d4af37\\' stroke-width=\\'1\\'><circle cx=\\'12\\' cy=\\'12\\' r=\\'10\\'/><path d=\\'M12 8v4l3 3\\'/></svg>'"
                             onclick="openModal('${meta._display_name} (${avatarState})', '${avatarState}', '${detailImg}', '帯: ${laneData.evidence_band} / 任務: ${laneData.current_task || 'なし'}')">
                        <div class="troop-info">
                            <h4>${meta._display_name} <span>兵力: ${power}</span></h4>
                            <p>状態: <strong style="color:var(--gold);">${avatarState}</strong></p>
                            <p>帯: ${laneData.evidence_band}</p>
                            <p style="font-size:0.65rem; color:var(--text-muted);">任務: ${laneData.current_task || 'なし'}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('troop-grid').innerHTML = `<p style="color:#ff6b6b; font-size:0.8rem;">データ同期エラー: ${err.message}</p>`;
            }
        }

        function openModal(title, stateName, imgSrc, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            const modalImg = document.getElementById('modal-img');
            modalImg.src = imgSrc;
            modalImg.onerror = () => { modalImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='1'><circle cx='12' cy='12' r='10'/><text x='12' y='16' font-size='5' text-anchor='middle' fill='%23d4af37'>NO IMAGE</text></svg>"; };
            document.getElementById('avatar-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('avatar-modal').classList.remove('active');
        }

        initApp();
    </script>
</body>
</html>
