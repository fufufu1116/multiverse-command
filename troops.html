<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIVERSE LIVE - 部隊・AI管理 ＆ 帝国城郭</title>
    <style>
        :root { 
            --bg-dark: #0b0f19; 
            --panel-bg: rgba(18, 24, 38, 0.9); 
            --gold: #d4af37; 
            --gold-light: #f3e5ab; 
            --text-main: #e2e8f0; 
            --text-muted: #94a3b8; 
            --border-gold: rgba(212, 175, 55, 0.4); 
        }
        body { 
            margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); 
            font-family: 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; 
        }
        header { 
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; 
            background: rgba(11, 15, 25, 0.95); border-bottom: 2px solid var(--gold); 
        }
        header h1 { margin: 0; font-size: 1.2rem; color: var(--gold); }
        .nav-btn { 
            color: var(--gold-light); text-decoration: none; font-size: 0.75rem; 
            border: 1px solid var(--border-gold); padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,0.3); 
        }
        .container { max-width: 1000px; margin: 15px auto; padding: 0 10px; display: grid; gap: 15px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-gold); border-radius: 8px; padding: 15px; }
        .panel h3 { margin-top: 0; color: var(--gold-light); border-bottom: 1px solid var(--border-gold); padding-bottom: 6px; font-size: 1rem; }
        
        /* 帝国・城郭ステータスエリア */
        .castle-banner { background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(18,24,38,0.95)); border: 2px solid var(--gold); border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 15px; }
        .castle-img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--gold); cursor: pointer; background: #111; }
        
        /* 部隊グリッド */
        .troop-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media(min-width: 600px) { .troop-grid { grid-template-columns: 1fr 1fr; } }
        
        .troop-card { background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-gold); border-radius: 6px; padding: 12px; display: flex; gap: 12px; align-items: center; }
        .avatar-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-gold); cursor: pointer; background: #111; flex-shrink: 0; }
        .troop-info { flex: 1; }
        .troop-info h4 { margin: 0 0 4px; color: var(--gold); font-size: 0.95rem; display: flex; justify-content: space-between; }
        .troop-info p { margin: 2px 0; font-size: 0.75rem; color: var(--text-muted); }

        /* モーダルウィンドウ (詳細版表示) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--panel-bg); border: 2px solid var(--gold); border-radius: 10px; padding: 20px; max-width: 90%; width: 350px; text-align: center; }
        .modal-content img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 6px; border: 1px solid var(--border-gold); margin-bottom: 15px; background: #111; }
        .close-btn { background: var(--gold); color: #0b0f19; border: none; padding: 8px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        footer { text-align: center; padding: 15px; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>⚔️ 部隊・AI管理 ＆ 帝国</h1>
        <a href="index.html" class="nav-btn">◀ 司令室へ</a>
    </header>

    <div class="container">
        <!-- 帝国・城郭エリア (自動判定) -->
        <div class="castle-banner" id="castle-banner">
            <img id="castle-img" class="castle-img" src="" alt="城郭" onclick="openModal('帝国(城)', castleStageName, castleDetailImg, castleNote)">
            <div>
                <h3 style="margin:0 0 5px; color:var(--gold);" id="castle-title">帝国城郭：判定中...</h3>
                <p style="margin:0; font-size:0.8rem;" id="castle-note">総兵力に応じた自動成長データ読込中</p>
                <p style="margin:5px 0 0; font-size:0.75rem; color:var(--text-muted);" id="total-power-display">総兵力: -</p>
            </div>
        </div>

        <!-- 部隊一覧パネル -->
        <div class="panel">
            <h3>稼働中の部隊 ＆ 実データ駆動ステータス</h3>
            <div class="troop-grid" id="troop-grid" style="margin-top: 10px;">
                <p style="font-size:0.85rem; color:var(--text-muted);">state.json を読み込み中...</p>
            </div>
        </div>
    </div>

    <!-- 詳細アバターモーダル -->
    <div id="avatar-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modal-title" style="color:var(--gold); margin-top:0;">詳細ビュー</h3>
            <img id="modal-img" src="" alt="Detail Avatar">
            <p id="modal-desc" style="font-size: 0.8rem; color: var(--text-muted);"></p>
            <button class="close-btn" onclick="closeModal()">閉じる</button>
        </div>
    </div>

    <footer>Owner主権 × AI連携 × 未来創造 (実データ完全連動)</footer>

    <!-- ロジックモジュールの読み込み -->
    <script src="power.js"></script>
    <script src="avatar.js"></script>
    <script src="castle_growth.js"></script>
    <script>
        // アバターマニフェスト定義 (v2二層構造)
        const MANIFEST = {
            "gunshi": {
                "_display_name": "ラファエル (軍師)",
                "通常": { "simple": "avatars/raphael_normal_s.png", "detail": "avatars/raphael_normal_d.png" },
                "思案中": { "simple": "avatars/raphael_thinking_s.png", "detail": "avatars/raphael_thinking_d.png" },
                "作戦中": { "simple": "avatars/raphael_active_s.png", "detail": "avatars/raphael_active_d.png" },
                "集中": { "simple": "avatars/raphael_focus_s.png", "detail": "avatars/raphael_focus_d.png" },
                "完了": { "simple": "avatars/raphael_done_s.png", "detail": "avatars/raphael_done_d.png" },
                "警戒・停止": { "simple": "avatars/raphael_alert_s.png", "detail": "avatars/raphael_alert_d.png" }
            },
            "hyakuninshou": {
                "_display_name": "百人将",
                "通常": { "simple": "avatars/hyakuninshou_normal.png", "detail": "avatars/hyakuninshou_normal.png" },
                "思案中": { "simple": "avatars/hyakuninshou_thinking.png", "detail": "avatars/hyakuninshou_thinking.png" },
                "作戦中": { "simple": "avatars/hyakuninshou_active.png", "detail": "avatars/hyakuninshou_active.png" },
                "集中": { "simple": "avatars/hyakuninshou_focus.png", "detail": "avatars/hyakuninshou_focus.png" },
                "完了": { "simple": "avatars/hyakuninshou_done.png", "detail": "avatars/hyakuninshou_done.png" },
                "警戒・停止": { "simple": "avatars/hyakuninshou_alert.png", "detail": "avatars/hyakuninshou_alert.png" }
            },
            "ai_kenkyu": {
                "_display_name": "AI研究",
                "通常": { "simple": "avatars/ai_kenkyu_normal.png", "detail": "avatars/ai_kenkyu_normal.png" },
                "思案中": { "simple": "avatars/ai_kenkyu_thinking.png", "detail": "avatars/ai_kenkyu_thinking.png" },
                "作戦中": { "simple": "avatars/ai_kenkyu_active.png", "detail": "avatars/ai_kenkyu_active.png" },
                "集中": { "simple": "avatars/ai_kenkyu_focus.png", "detail": "avatars/ai_kenkyu_focus.png" },
                "完了": { "simple": "avatars/ai_kenkyu_done.png", "detail": "avatars/ai_kenkyu_done.png" },
                "警戒・停止": { "simple": "avatars/ai_kenkyu_alert.png", "detail": "avatars/ai_kenkyu_alert.png" }
            },
            "system_kaizen": {
                "_display_name": "システム改善",
                "通常": { "simple": "avatars/system_kaizen_normal.png", "detail": "avatars/system_kaizen_normal.png" },
                "思案中": { "simple": "avatars/system_kaizen_thinking.png", "detail": "avatars/system_kaizen_thinking.png" },
                "作戦中": { "simple": "avatars/system_kaizen_active.png", "detail": "avatars/system_kaizen_active.png" },
                "集中": { "simple": "avatars/system_kaizen_focus.png", "detail": "avatars/system_kaizen_focus.png" },
                "完了": { "simple": "avatars/system_kaizen_done.png", "detail": "avatars/system_kaizen_done.png" },
                "警戒・停止": { "simple": "avatars/system_kaizen_alert.png", "detail": "avatars/system_kaizen_alert.png" }
            },
            "tokushu_butai": {
                "_display_name": "特殊部隊",
                "通常": { "simple": "avatars/tokushu_butai_normal.png", "detail": "avatars/tokushu_butai_normal.png" },
                "思案中": { "simple": "avatars/tokushu_butai_thinking.png", "detail": "avatars/tokushu_butai_thinking.png" },
                "作戦中": { "simple": "avatars/tokushu_butai_active.png", "detail": "avatars/tokushu_butai_active.png" },
                "集中": { "simple": "avatars/tokushu_butai_focus.png", "detail": "avatars/tokushu_butai_focus.png" },
                "完了": { "simple": "avatars/tokushu_butai_done.png", "detail": "avatars/tokushu_butai_done.png" },
                "警戒・停止": { "simple": "avatars/tokushu_butai_alert.png", "detail": "avatars/tokushu_butai_alert.png" }
            }
        };

        const CASTLE_IMAGES = {
            "陣屋": { "simple": "avatars/castle_jinya_s.png", "detail": "avatars/castle_jinya_d.png" },
            "砦": { "simple": "avatars/castle_toride_s.png", "detail": "avatars/castle_toride_d.png" },
            "小城": { "simple": "avatars/castle_shojo_s.png", "detail": "avatars/castle_shojo_d.png" },
            "大城": { "simple": "avatars/castle_taijo_s.png", "detail": "avatars/castle_taijo_d.png" },
            "帝都": { "simple": "avatars/castle_teito_s.png", "detail": "avatars/castle_teito_d.png" }
        };

        let castleStageName = "";
        let castleDetailImg = "";
        let castleNote = "";

        async function initApp() {
            try {
                const response = await fetch('state.json');
                if (!response.ok) throw new Error("state.jsonの取得に失敗しました");
                const state = await response.json();

                // power.jsによる実データ計算
                const computed = computeState(state);
                const totalPower = computed.totalPower;
                const lanePowers = computed.lanePowers;

                // castle_growth.jsによる城の自動判定
                const castleStage = deriveCastleStage(totalPower);
                castleStageName = castleStage.name;
                castleNote = castleStage.detail_note;
                const castleImgs = CASTLE_IMAGES[castleStageName] || { simple: "", detail: "" };
                castleDetailImg = castleImgs.detail;

                document.getElementById('castle-title').innerText = `帝国城郭：【 ${castleStage.name} 】`;
                document.getElementById('castle-note').innerText = castleStage.detail_note;
                document.getElementById('total-power-display').innerText = `総兵力: ${totalPower}`;
                const castleImgEl = document.getElementById('castle-img');
                castleImgEl.src = castleImgs.simple;
                castleImgEl.onerror = () => { castleImgEl.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='1'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='M3 9h18M9 21V9'/></svg>"; };

                // 部隊カードの動的レンダリング
                const grid = document.getElementById('troop-grid');
                grid.innerHTML = "";
                const nowMs = Date.now();

                for (const laneId of Object.keys(state.lanes)) {
                    const laneData = state.lanes[laneId];
                    const meta = MANIFEST[laneId] || { _display_name: laneId, 通常: { simple: "", detail: "" } };
                    
                    // avatar.jsによる6状態の自動判定
                    const avatarState = deriveAvatarState(laneData, nowMs);
                    const avatars = (meta[avatarState] || meta["通常"]);
                    const simpleImg = avatars ? avatars.simple : "";
                    const detailImg = avatars ? avatars.detail : "";
                    const power = lanePowers[laneId] || 0;

                    const card = document.createElement('div');
                    card.className = "troop-card";
                    card.innerHTML = `
                        <img class="avatar-thumb" src="${simpleImg}" alt="${avatarState}" 
                             onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'60\\' height=\\'60\\' viewBox=\\'0 0 24 24\' fill=\\'none\' stroke=\\'%23d4af37\' stroke-width=\\'1\'><circle cx=\\'12\' cy=\\'12\' r=\\'10\'/><path d=\\'M12 8v4l3 3\\'/></svg>'"
                             onclick="openModal('${meta._display_name} (${avatarState})', '${avatarState}', '${detailImg}', '帯: ${laneData.evidence_band} / 任務: ${laneData.current_task || 'なし'}')">
                        <div class="troop-info">
                            <h4>${meta._display_name} <span>兵力: ${power}</span></h4>
                            <p>状態: <strong style="color:var(--gold);">${avatarState}</strong></p>
                            <p>帯: ${laneData.evidence_band}</p>
                            <p style="font-size:0.7rem; color:var(--text-muted);">任務: ${laneData.current_task || 'なし'}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('troop-grid').innerHTML = `<p style="color:#ff6b6b; font-size:0.85rem;">state.json 読み込み失敗: ${err.message}</p>`;
            }
        }

        // モーダル制御
        function openModal(title, stateName, imgSrc, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            const modalImg = document.getElementById('modal-img');
            modalImg.src = imgSrc;
            modalImg.onerror = () => { modalImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='1'><circle cx='12' cy='12' r='10'/><text x='12' y='16' font-size='6' text-anchor='middle' fill='%23d4af37'>NO IMAGE</text></svg>"; };
            document.getElementById('avatar-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('avatar-modal').classList.remove('active');
        }

        // 実行
        initApp();
    </script>
</body>
</html>
