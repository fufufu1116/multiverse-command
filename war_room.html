<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIVERSE LIVE - 円卓会議室</title>
    <style>
        :root { 
            --bg-dark: #0b0f19; 
            --panel-bg: rgba(18, 24, 38, 0.92); 
            --gold: #d4af37; 
            --gold-light: #f3e5ab; 
            --text-main: #e2e8f0; 
            --text-muted: #94a3b8; 
            --border-gold: rgba(212, 175, 55, 0.4); 
        }
        body { 
            margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); 
            font-family: 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; padding-bottom: 70px;
        }
        header { 
            display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; 
            background: rgba(11, 15, 25, 0.95); border-bottom: 2px solid var(--gold); 
        }
        header h1 { margin: 0; font-size: 1.1rem; color: var(--gold); }
        .nav-btn { 
            color: var(--gold-light); text-decoration: none; font-size: 0.75rem; 
            border: 1px solid var(--border-gold); padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,0.3); 
        }

        .container { max-width: 1000px; margin: 12px auto; padding: 0 10px; display: grid; gap: 12px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-gold); border-radius: 8px; padding: 12px; }
        .panel h3 { margin-top: 0; color: var(--gold-light); border-bottom: 1px solid var(--border-gold); padding-bottom: 5px; font-size: 0.9rem; }

        /* 円卓ビジュアルコンテナ */
        .round-table-container { 
            position: relative; width: 100%; height: 260px; 
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(11,15,25,0.95) 70%);
            border: 2px solid var(--border-gold); border-radius: 12px; display: flex; align-items: center; justify-content: center;
            margin: 10px 0; overflow: hidden;
        }
        /* 中央の円テーブル */
        .center-table { 
            width: 110px; height: 110px; border: 2px dashed var(--gold); border-radius: 50%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(18, 24, 38, 0.85); box-shadow: 0 0 20px rgba(212,175,55,0.2); text-align: center;
        }
        .center-table span { font-size: 0.65rem; color: var(--gold-light); }

        /* 周囲に配置する部隊アイコン（簡易円形配置） */
        .seat { 
            position: absolute; width: 60px; text-align: center; font-size: 0.7rem; color: var(--text-main);
        }
        .seat .avatar-circle { 
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--gold); 
            background: rgba(15, 23, 42, 0.95); margin: 0 auto 3px; display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; color: var(--gold); box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        /* 各シートの位置調整 */
        .seat-top { top: 12px; left: calc(50% - 30px); }
        .seat-top-right { top: 35px; right: 25px; }
        .seat-bottom-right { bottom: 25px; right: 35px; }
        .seat-bottom-left { bottom: 25px; left: 35px; }
        .seat-top-left { top: 35px; left: 25px; }

        /* 討議ログストリーム */
        .chat-stream { display: grid; gap: 8px; margin-top: 8px; }
        .chat-bubble { 
            background: rgba(15, 23, 42, 0.9); border-left: 3px solid var(--gold); 
            padding: 10px; border-radius: 0 6px 6px 0; font-size: 0.8rem; 
        }

        /* ボトムナビゲーション */
        nav.bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(11, 15, 25, 0.98); 
            border-top: 1px solid var(--border-gold); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; 
        }
        nav.bottom-nav a { 
            color: var(--text-muted); text-decoration: none; font-size: 0.65rem; text-align: center; 
            display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1;
        }
        nav.bottom-nav a.active { color: var(--gold); }
        nav.bottom-nav span.icon { font-size: 1.1rem; }
    </style>
</head>
<body>
    <header>
        <h1>🛡️ 円卓会議室</h1>
        <a href="index.html" class="nav-btn">◀ 司令室へ</a>
    </header>

    <div class="container">
        <!-- 円卓ビジュアルエリア -->
        <div class="panel">
            <h3>円卓首脳会議（マルチバース接続中）</h3>
            <div class="round-table-container">
                <!-- 中央の円卓 -->
                <div class="center-table">
                    <span style="font-size: 1.2rem;">⚔️</span>
                    <span>円卓会議</span>
                </div>

                <!-- 周囲の席（各部隊・Emperor） -->
                <div class="seat seat-top">
                    <div class="avatar-circle">👑</div>
                    <span style="color:var(--gold);">Emperor</span>
                </div>
                <div class="seat seat-top-right">
                    <div class="avatar-circle">軍</div>
                    <span>ラファエル</span>
                </div>
                <div class="seat seat-bottom-right">
                    <div class="avatar-circle">百</div>
                    <span>百人将</span>
                </div>
                <div class="seat seat-bottom-left">
                    <div class="avatar-circle">AI</div>
                    <span>AI研究</span>
                </div>
                <div class="seat seat-top-left">
                    <div class="avatar-circle">改</div>
                    <span>システム</span>
                </div>
            </div>
        </div>

        <!-- 討議ログ -->
        <div class="panel">
            <h3>討議ストリームログ</h3>
            <div class="chat-stream">
                <div class="chat-bubble"><strong style="color:var(--gold);">Emperor：</strong>円卓の結節点を展開せよ。各部隊の同期状態はどうなっている？</div>
                <div class="chat-bubble"><strong style="color:var(--gold);">ラファエル（軍師）：</strong>全兵力の統合および自動計算パイプライン、正常に稼働中です。</div>
                <div class="chat-bubble"><strong style="color:var(--gold);">システム改善：</strong>円卓会議室のビジュアル基盤を円形配置に刷新したぜ。</div>
            </div>
        </div>
    </div>

    <!-- ボトムナビゲーション -->
    <nav class="bottom-nav">
        <a href="index.html">
            <span class="icon">🏰</span>
            <span>司令室</span>
        </a>
        <a href="war_room.html" class="active">
            <span class="icon">🛡️</span>
            <span>円卓</span>
        </a>
        <a href="troops.html">
            <span class="icon">⚔️</span>
            <span>部隊</span>
        </a>
        <a href="archives.html">
            <span class="icon">📜</span>
            <span>記録</span>
        </a>
    </nav>
</body>
</html>
